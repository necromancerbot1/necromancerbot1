  <!-- ================= FOOTER / CONNECTION ================= -->
  <g transform="translate(40, 1620)">
    <text x="410" y="40" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="26" font-weight="bold" fill="#58A6FF" filter="url(#neon-blue)">[ SOSIAL MEDIA ]</text>
    
    <g transform="translate(140, 80)">
      <!-- Tombol Kontak Bergaya Terminal -->
      <rect x="0" y="0" width="160" height="45" fill="#0D1117" stroke="#58A6FF" stroke-width="1.5" rx="5" filter="url(#neon-blue)"/>
      <text x="80" y="27" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" fill="#FFFFFF">E-MAIL</text>
      
      <rect x="190" y="0" width="160" height="45" fill="#0D1117" stroke="#D2A8FF" stroke-width="1.5" rx="5" filter="url(#neon-purple)"/>
      <text x="270" y="27" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" fill="#FFFFFF">LINKEDIN</text>
      
      <rect x="380" y="0" width="160" height="45" fill="#0D1117" stroke="#58A6FF" stroke-width="1.5" rx="5" filter="url(#neon-blue)"/>
      <text x="460" y="27" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" fill="#FFFFFF">WEB PORTOFOLIO</text>
    </g>

    <text x="410" y="180" text-anchor="middle" font-family="monospace" font-size="12" fill="#8B949E">>> SYSTEM OPERATION NORMAL. END OF FILE. &lt;&lt;</text>
  </g>
</svg>
