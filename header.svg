<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250">
  <defs>
    <!-- Efek Neon Biru -->
    <filter id="neon-blue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="neon-purple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Latar Belakang Gelap GitHub -->
  <rect width="100%" height="100%" fill="#0D1117" rx="15" />

  <!-- Garis Border Utama yang Menyala -->
  <rect x="25" y="25" width="750" height="200" rx="10" fill="none" stroke="#58A6FF" stroke-width="1.5" filter="url(#neon-blue)" opacity="0.8" />
  <rect x="25" y="25" width="750" height="200" rx="10" fill="none" stroke="#58A6FF" stroke-width="1" />

  <!-- Sudut Elegan (Siku-siku seperti di gambar) -->
  <path d="M 25 60 L 25 25 L 60 25" fill="none" stroke="#58A6FF" stroke-width="3" filter="url(#neon-blue)" />
  <path d="M 775 60 L 775 25 L 740 25" fill="none" stroke="#58A6FF" stroke-width="3" filter="url(#neon-blue)" />
  <path d="M 25 190 L 25 225 L 60 225" fill="none" stroke="#58A6FF" stroke-width="3" filter="url(#neon-blue)" />
  <path d="M 775 190 L 775 225 L 740 225" fill="none" stroke="#58A6FF" stroke-width="3" filter="url(#neon-blue)" />

  <!-- Nama Utama Menyala -->
  <text x="50%" y="45%" text-anchor="middle" font-family="Arial, sans-serif" font-size="46" font-weight="bold" fill="#FFFFFF" filter="url(#neon-blue)" letter-spacing="4">HELLO, I'AM FAREL</text>
  <text x="50%" y="45%" text-anchor="middle" font-family="Arial, sans-serif" font-size="46" font-weight="bold" fill="#FFFFFF" letter-spacing="4">HELLO, I'AM FAREL</text>

  <!-- Teks Subtitle -->
  <text x="50%" y="65%" text-anchor="middle" font-family="monospace" font-size="16" fill="#D2A8FF" filter="url(#neon-purple)" letter-spacing="2">CYBER SECURITY | 3D MODELING | WEB DEV</text>

  <!-- Tombol Kecil "OPEN TO WORK" -->
  <rect x="330" y="175" width="140" height="30" rx="15" fill="none" stroke="#3FB950" stroke-width="2" />
  <circle cx="345" cy="190" r="4" fill="#3FB950" />
  <text x="360" y="194" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#3FB950">OPEN TO WORK</text>
</svg>

